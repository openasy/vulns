{{- if not .Values.auth.existingSecret }}
{{- if and (not .Values.vulns.enabled) (not .Values.auth.ingestToken) }}
{{- fail "auth.ingestToken (or auth.existingSecret) is required when vulns.enabled is false: the VULNS_INGEST_TOKEN of the vulns the agents report to" }}
{{- end }}
{{- /* Generated tokens are created once and kept across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "vulns.fullname" .) }}
{{- $old := dict }}
{{- if $existing }}{{ $old = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulns.fullname" . }}
  labels:
    {{- include "vulns.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.vulns.enabled }}
  VULNS_ADMIN_TOKEN: {{ .Values.auth.adminToken | b64enc | default (get $old "VULNS_ADMIN_TOKEN") | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
  VULNS_INGEST_TOKEN: {{ .Values.auth.ingestToken | b64enc | default (get $old "VULNS_INGEST_TOKEN") | default (randAlphaNum 48 | b64enc) | quote }}
  {{- if .Values.vulns.enabled }}
  # The key that encrypts secrets in the database (ADR 0021). Mounted as a file, not an environment variable.
  openasy-kek: {{ get $old "openasy-kek" | default (randBytes 32 | b64enc) | quote }}
  {{- end }}
{{- end }}
