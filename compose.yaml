# Vulnerabilities: the product (API, web UI and Grype) plus vulns-agent for this host.
# Run one vulns-agent on every other host you want covered; send image SBOMs from CI (see README).
#
#   export VULNS_INGEST_TOKEN=$(openssl rand -hex 32)
#   openssl rand -hex 32 > openasy-kek   # encrypts secrets in the database (ADR 0021); keep it with your backups
#   docker compose up -d
#   docker compose logs vulns | grep 'no owner yet'   # the one-time link that creates the owner account
#
# The first start downloads about 200 MB of vulnerability data (3 GB unpacked on the volume).
services:
  vulns:
    image: ghcr.io/openasy/vulns:0.2.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - vulns-data:/data # SQLite database, SBOMs and the vulnerability data
      # - ./hosts.yaml:/config/hosts.yaml:ro   # the install's servers, to see which ones have no scan
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The install's hosts file (ADR 0052), to list servers with no scan:
      # OPENASY_HOSTS: /config/hosts.yaml
      # The address people open vulns at; with a TLS proxy in front, its https:// URL.
      VULNS_PUBLIC_URL: ${VULNS_PUBLIC_URL:-http://localhost:8080}
      VULNS_INGEST_TOKEN: ${VULNS_INGEST_TOKEN:?set VULNS_INGEST_TOKEN}
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: vulns
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}
      # OPENASY_OIDC_ROLE_MAPPING: vulns-admins=admin,staff=viewer
      # VULNS_FEED_UPDATE_HOURS: "0"   # air-gapped: no downloads, import the data with PUT /api/v1/feed

  vulns-agent:
    image: ghcr.io/openasy/vulns-agent:0.2.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    hostname: ${HOSTNAME:-host} # the name this host gets in vulns
    volumes:
      - /:/host:ro # read-only: the agent lists packages, it never changes the host
    environment:
      VULNS_URL: http://vulns:8080
      VULNS_INGEST_TOKEN: ${VULNS_INGEST_TOKEN:?set VULNS_INGEST_TOKEN}
    depends_on:
      - vulns

volumes:
  vulns-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
